# MoonBit 主链路门禁：check / test / fmt（接口漂移只提示，不阻断）
# 与 diff.yml 拆开：依赖不同（这里只要 MoonBit）、失败原因要隔离
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 为什么需要 MOON_CC：moon 探测 C 编译器时按 cl → cc → gcc → clang 的顺序找，
  # 而 `cl` 是 MSVC 的编译器名。Linux 上 `cliquer` 包会提供同名的 `/usr/bin/cl`
  # （图论工具），moon 撞上它就误判为 MSVC 环境，转去找 `lib.exe` 而失败：
  #   failed to resolve native archiver executable `/usr/bin/lib.exe`
  # 显式指定编译器即可绕过这个撞名问题。
  # MOON_AR / MOON_LD 非必需，实测只给 MOON_CC 就能过，故不写。
  MOON_CC: clang

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache MoonBit toolchain
        uses: actions/cache@v5
        with:
          path: ~/.moon
          key: moon-${{ runner.os }}-${{ hashFiles('moon.mod') }}

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          moon version --all
          clang --version | head -1

      # checkout 里没有 .mooncakes/（已 gitignore），先让 moon 解析并拉取依赖
      - name: moon update
        run: moon update

      - name: moon check
        run: moon check --target native

      - name: moon test
        run: moon test --target native

      - name: format check
        run: moon fmt --check

      # 只提示，不阻断。工具链追 latest，而 .mbti 内容随 moonc 版本漂移，
      # 设成硬门禁就会拿上游的改动卡自己的 PR。
      # 用 git status 而不是 git diff：git diff 看不到「未跟踪的 .mbti 被凭空生成」这种情况。
      - name: interface drift check (.mbti, 仅提示)
        run: |
          moon info
          if [ -n "$(git status --porcelain)" ]; then
            echo "::group::moon info 产生的差异"
            git status --short
            git --no-pager diff
            echo "::endgroup::"
            echo "::warning::pkg.generated.mbti 有漂移。若是自己改了公开 API，跑 moon info 并提交；若只是工具链升级带来的，忽略即可"
          else
            echo ".mbti 无漂移"
          fi
